<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WePlanYourTravel AI - Best Real Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#0a0a0b;color:white}
.nav{padding:14px 5%;display:flex;justify-content:space-between;position:sticky;top:0;background:rgba(10,10,11,.95);z-index:99}
.logo{font-weight:800;font-size:22px}.logo span{color:#a5b4fc}
.hero{padding:20px 5% 10px;text-align:center}
.hero h1{font-size:42px;font-weight:800}.hero h1 span{color:#a5b4fc}
.tabs{max-width:700px;margin:18px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tab{padding:14px;border-radius:14px;border:2px solid #27272a;background:#18181b;color:white;font-weight:800;cursor:pointer}
.tab.active{background:#6366f1;border-color:#6366f1}
.search-wrap{max-width:1200px;margin:16px auto;background:white;border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;position:relative}
.field label{display:block;font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1.5px solid #eef2f7;border-radius:10px;background:#f8fafc;color:#0f172a;font-weight:700;font-size:13px}
.field{position:relative}
.btn{grid-column:span 3;padding:14px;background:#6366f1;color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #e2e8f0;border-radius:12px;max-height:380px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-top:6px}
.autocomplete-item{padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;color:#0f172a;font-weight:600}
.autocomplete-item:hover{background:#eef2ff}
.features{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;max-width:1300px;margin:14px auto;padding:0 4%}
.fcard{border-radius:18px;overflow:hidden;height:300px;position:relative;background:#111;cursor:pointer}
.fcard img{width:100%;height:100%;object-fit:cover}
.fcard-info{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
#output{display:none;max-width:1150px;margin:20px auto;background:#f5f6f8;color:#0f172a;border-radius:24px;padding:18px}
.sub-header{background:white;border-radius:20px;padding:18px;margin-bottom:16px;border:1px solid #eef2f7}
.sub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.sub-card{border-radius:16px;overflow:hidden;background:white;border:1px solid #eef2f7;cursor:pointer}
.sub-card img{width:100%;height:150px;object-fit:cover}
.sub-card-body{padding:12px}
.day{background:white;border-radius:20px;padding:16px;margin-top:16px;border:1px solid #eef2f7}
.timeline{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:8px}
.step{min-width:280px;flex:1;border-radius:14px;overflow:hidden;background:#f8fafc;border:1px solid #f1f5f9;position:relative}
.step img{width:100%;height:160px;object-fit:cover;display:block;background:#ddd}
.step-content{padding:10px}
.time{position:absolute;top:8px;left:8px;background:#6366f1;color:white;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800}
.arrow{display:flex;align-items:center;justify-content:center;min-width:24px;font-size:20px;color:#6366f1;font-weight:800}
.near{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.near a{font-size:9px;padding:6px;border-radius:6px;text-align:center;text-decoration:none;font-weight:700;background:#0f172a;color:white}
@media(max-width:700px){.search-wrap{grid-template-columns:1fr 1fr}.btn{grid-column:span 2}.features{grid-template-columns:1fr 1fr}.sub-grid{grid-template-columns:1fr}}
</style>
</head>

function showSuggest(val){
 let box=document.getElementById('suggestBox');
 if(!val || val.trim().length<1){box.style.display='none';return;}
 let q=val.toLowerCase().trim();
 let list = ALL_PLACES.filter(p=>p.toLowerCase().startsWith(q)).slice(0,12);
 if(list.length<10){
   let more = ALL_PLACES.filter(p=>p.toLowerCase().includes(q) && !list.includes(p)).slice(0,12-list.length);
   list=list.concat(more);
 }
 if(list.length===0){box.style.display='none';return;}
 box.innerHTML = list.map(r=>{
   let h=r.replace(new RegExp(val,'i'), m=>'<b style=color:#6366f1>'+m+'</b>');
   return '<div class="autocomplete-item" onclick="selectPlace(\''+r.replace(/'/g,"\\'")+'\')"><span>'+h+'</span><small>✈️</small></div>';
 }).join('');
 box.style.display='block';
}
function selectPlace(n){document.getElementById('place').value=n;document.getElementById('suggestBox').style.display='none';}

function getData(p){
 let k=p.toLowerCase().replace(/[^a-z]/g,'').replace(/temple|lake|beach|tower/g,'');
 if(DB[k]) return DB[k];
 for(let key of Object.keys(DB)){
   if(k.includes(key) || key.includes(k) || p.toLowerCase().includes(key)) return DB[key];
 }
 let pool=[
  "https://images.unsplash.com/photo-1477587458883-47145ed94245?w=600",
  "https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=600",
  "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600",
  "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600",
  "https://images.unsplash.com/photo-1527668752968-14dc70a27cbb?w=600",
  "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600",
  "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600",
  "https://images.unsplash.com/photo-1534008897995-27a23e859048?w=600",
  "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600"
 ];
 let h=0; for(let i=0;i<p.length;i++) h=(h*31+p.charCodeAt(i))%100;
 return {
  name:p.toUpperCase(),
  days:[
   [
    {n:p+" Main Temple / Palace",t:"9:00 AM - 1st",h:"Main attraction",c:"₹50",i:pool[(h+0)%pool.length]},
    {n:p+" Local Bazaar Market",t:"11:30 AM - 2nd",h:"0.5km market",c:"Free",i:pool[(h+1)%pool.length]},
    {n:p+" Lake / Park Sunset",t:"4:00 PM - 3rd",h:"Evening park",c:"Free",i:pool[(h+2)%pool.length]}
   ]
  ]
 };
}
function renderFullPlan(p,days,trav,budget){
 let data=getData(p);
 let out=document.getElementById('output');
 out.style.display='block';
 out.innerHTML='<h2>✅ '+data.name+' • '+days+' Days • '+trav+' people • ₹'+budget+'/person</h2><p style="color:#64748b;font-size:11px;margin-top:6px">Every place has DIFFERENT real photo - No same photo repeat!</p>';
 for(let i=0;i<days;i++){
   let cl=data.days[i%data.days.length];
   out.innerHTML+='<div class="day"><div style="display:flex;justify-content:space-between"><h3>Day '+(i+1)+' - '+cl[0].n+' Route</h3><span style="font-size:10px;padding:4px 8px;border-radius:20px;background:#e0e7ff;color:#4338ca;font-weight:700">Day '+(i+1)+'</span></div><div class="timeline">'+cl.map((c,idx)=>'<div class="step"><span class="time">'+c.t+'</span><img src="'+c.i+'" alt="'+c.n+'" loading="lazy"><div class="step-content"><b>'+(idx+1)+'. '+c.n+'</b><small style="display:block;color:#64748b">➡️ '+c.h+'</small><small style="color:#16a34a;font-weight:700">'+c.c+'</small><div class="near"><a target="_blank" href="https://www.google.com/maps/search/'+encodeURIComponent(c.n+' '+p)+'">📍 Map</a><a target="_blank" href="https://www.google.com/maps/search/restaurants+near+'+encodeURIComponent(c.n)+'">🍽️ Food</a><a target="_blank" href="https://www.google.com/maps/search/hotels+in+'+encodeURIComponent(p)+'">🏨 Stay</a><a target="_blank" href="https://www.google.com/maps/search/bike+rental+near+'+encodeURIComponent(p)+'">🚲 Bike</a></div></div></div>'+(idx<cl.length-1?'<div class="arrow">→</div>':'')).join('')+'</div></div>';
 }
 out.scrollIntoView({behavior:'smooth'});
}
function genAuto(){
 let p=document.getElementById('place').value.trim()||'mount abu';
 let days=parseInt(document.getElementById('days').value)||3;
 let trav=document.getElementById('trav').value||2;
 let bud=parseInt(document.getElementById('budget').value)||7000;
 renderFullPlan(p,days,trav,bud);
}
function quickPlan(place){renderFullPlan(place,3,2,7000);}
function showSubPlaces(key){
