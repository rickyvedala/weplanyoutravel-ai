<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WePlanYourTravel AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#07070a;color:#fff;padding:12px}
.head{text-align:center;padding:18px 0}
.logo{font-size:32px;font-weight:800}.logo b{color:#a5b4fc}
.hero{text-align:center;font-size:36px;font-weight:800;margin:10px 0;line-height:1}
.hero i{color:#a5b4fc;font-style:normal}
.tabs{display:flex;gap:8px;max-width:360px;margin:14px auto;background:#18181b;padding:6px;border-radius:100px}
.tab{flex:1;padding:11px;border-radius:100px;border:0;background:transparent;color:#aaa;font-weight:700;cursor:pointer}
.tab.on{background:#6366f1;color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.4)}
.box{background:#fff;border-radius:24px;padding:18px;color:#111;max-width:980px;margin:0 auto}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.g{grid-template-columns:1fr 1fr}.hero{font-size:26px}}
.lb{font-size:10px;color:#6366f1;font-weight:800;margin-bottom:4px}
.in{width:100%;padding:12px;border-radius:12px;border:1.5px solid #eef2f7;background:#f8fafc;font-weight:600;outline:none}
.in:focus{border-color:#6366f1;background:#fff}
.go{width:100%;margin-top:12px;padding:14px;background:#6366f1;color:#fff;border:0;border-radius:12px;font-weight:800;cursor:pointer}
.rel{position:relative}.auto{position:absolute;top:104%;left:0;right:0;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.2);z-index:99;display:none;max-height:220px;overflow:auto;border:1px solid #f1f5f9}
.auto div{padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px solid #f8fafc}
.auto div:hover{background:#f5f3ff}
.pl{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
@media(max-width:600px){.pl{grid-template-columns:1fr 1fr}}
.pc{height:200px;border-radius:18px;overflow:hidden;position:relative;cursor:pointer}
.pc img{width:100%;height:100%;object-fit:cover}.gr{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
.t{position:absolute;bottom:0;left:0;right:0;padding:10px}.t1{color:#fff;font-weight:800;font-size:13px}.t2{color:#e4e4e7;font-size:10px}
.out{margin-top:14px;background:#f6f7f9;border-radius:22px;padding:16px;display:none;color:#111}
.day{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid #eef2f7}
.row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.sp{min-width:210px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:12px;padding:10px}
.tm{font-size:9px;background:#6366f1;color:#fff;padding:3px 7px;border-radius:100px;display:inline-block;font-weight:700}
.nm{font-weight:800;font-size:12px;margin:5px 0}.hi{font-size:11px;color:#64748b}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.bn{padding:6px;border-radius:8px;background:#0f172a;color:#fff;font-size:9px;font-weight:700;text-decoration:none;text-align:center}
</style>
</head>
<body>
<div class="head"><div class="logo">✈️ WePlan<b>YourTravel</b> AI</div><div style="color:#71717a;font-size:10px;letter-spacing:2px;margin-top:4px">MOST BEAUTIFUL • EASY • FAST</div></div>
<div class="hero">Start Planning<br><i>Free →</i></div>
<div class="tabs"><button class="tab on" id="b1" onclick="showTab('a')">🤖 AutoPlan</button><button class="tab" id="b2" onclick="showTab('e')">📋 Explore Places</button></div>
<div class="box" id="aBox">
<div class="g">
<div class="rel"><div class="lb">📍 Where? Type th / mal / mount abu</div><input id="pl" class="in" placeholder="Mount Abu, Thailand, Malaysia..." oninput="auto()"><div id="ac" class="auto"></div></div>
<div><div class="lb">📅 Days</div><input id="dy" class="in" type="number" value="3"></div>
<div><div class="lb">👥 Travellers</div><input id="tr" class="in" type="number" value="2"></div>
</div>
<button class="go" onclick="make()">✨ Generate Travel Plan →</button>
</div>
<div class="box" id="eBox" style="display:none"><div class="lb" style="margin-bottom:10px">16 BEAUTIFUL PLACES - CLICK ANY TO PLAN</div><div class="pl" id="grid"></div></div>
<div class="box out" id="out"></div>
<script>
const ALL=["Mount Abu","Mount Abu Dilwara Temple","Mount Abu Nakki Lake","Mount Abu Guru Shikhar","Malshej Ghat Maharashtra","Matheran Maharashtra","Mahabaleshwar","Malvan Tarkarli","Malpe Beach","Malaysia Kuala Lumpur","Malaysia Langkawi","Maldives","Thailand","Thailand Phuket","Thailand Bangkok","Thekkady Periyar","Thanjavur Temple","Munnar Kerala","Alleppey","Udaipur","Jaipur","Goa Baga Beach","Araku Valley","Paris Eiffel Tower","London Big Ben","Dubai Burj Khalifa","Bali Uluwatu","Switzerland Jungfrau","Singapore Marina Bay","Egypt Pyramids"];
const PLACES=[["Mount Abu","Dilwara • Nakki Lake","https://images.unsplash.com/photo-1603262110263-fb01144e7d13"],["Rajasthan","Jaipur • Udaipur","https://images.unsplash.com/photo-1477587458883-47145ed94245"],["Maharashtra","Malshej • Matheran","https://images.unsplash.com/photo-1506905925346-21bda4d32df4"],["Kerala","Munnar • Alleppey","https://images.unsplash.com/photo-1602216056096-3b40cc0c9944"],["Malaysia","Kuala Lumpur","https://images.unsplash.com/photo-1596422846543-75c6fc197f07"],["Maldives","Overwater Villas","https://images.unsplash.com/photo-1514282401047-d79a71a590e8"],["Thailand","Phuket • Bangkok","https://images.unsplash.com/photo-1552465011-b4e21bf6e79a"],["Goa","Baga • Dudhsagar","https://images.unsplash.com/photo-1512343879784-a960bf40e7f2"],["Dubai","Burj Khalifa","https://images.unsplash.com/photo-1512453979798-5ea266f8880c"],["Bali","Uluwatu Temple","https://images.unsplash.com/photo-1537996194471-e657df975ab4"],["Paris","Eiffel Tower","https://images.unsplash.com/photo-1502602898657-3e91760cbb34"],["London","Big Ben","https://images.unsplash.com/photo-1513635269975-59663e0ac1ad"],["Switzerland","Jungfrau","https://images.unsplash.com/photo-1527668752968-14dc70a27cbb"],["Singapore","Marina Bay","https://images.unsplash.com/photo-1525625293386-3f8f993a32c4"],["Egypt","Pyramids","https://images.unsplash.com/photo-1503177119275-0aa32b3a9368"],["Andhra","Araku • Vizag","https://images.unsplash.com/photo-1506905925346-21bda4d32df4"]];
function showTab(x){document.getElementById('aBox').style.display=x=='a'?'block':'none';document.getElementById('eBox').style.display=x=='e'?'block':'none';document.getElementById('b1').className=x=='a'?'tab on':'tab';document.getElementById('b2').className=x=='e'?'tab on':'tab'}
function auto(){let q=document.getElementById('pl').value.toLowerCase(),b=document.getElementById('ac');if(!q){b.style.display='none';return}let s=ALL.filter(v=>v.toLowerCase().startsWith(q)),m=ALL.filter(v=>!s.includes(v)&&v.toLowerCase().includes(q)),r=[...s,...m].slice(0,10);if(!r.length){b.style.display='none';return}b.innerHTML=r.map(v=>`<div onclick="pick('${v}')">${v}</div>`).join('');b.style.display='block'}
function pick(v){document.getElementById('pl').value=v;document.getElementById('ac').style.display='none'}
document.addEventListener('click',e=>{if(!e.target.closest('.rel'))document.getElementById('ac').style.display='none'})
document.getElementById('grid').innerHTML=PLACES.map(p=>`<div class="pc" onclick="document.getElementById('pl').value='${p[0]}';showTab('a');make()"><img src="${p[2]}" loading="lazy"><div class="gr"></div><div class="t"><div class="t1">${p[0]}</div><div class="t2">${p[1]}</div></div></div>`).join('');
function make(){
let place=document.getElementById('pl').value||"Mount Abu";
let days=parseInt(document.getElementById('dy').value)||3;
let out=document.getElementById('out');out.style.display='block';
let mount=[
[{n:"Dilwara Temples",t:"9:00 AM",d:"White marble Jain temples, stunning carvings",c:"Free",k:"Dilwara Temples Mount Abu"},{n:"Nakki Lake",t:"11:30 AM",d:"Sacred lake boating, 0.5km from Dilwara",c:"₹100",k:"Nakki Lake Mount Abu"},{n:"Toad Rock",t:"3:30 PM",d:"Frog shaped rock viewpoint",c:"Free",k:"Toad Rock Mount Abu"}],
[{n:"Guru Shikhar",t:"8:30 AM",d:"Highest peak Rajasthan 1722m",c:"Free",k:"Guru Shikhar Mount Abu"},{n:"Achalgarh Fort",t:"11:00 AM",d:"14th century fort & temple",c:"₹50",k:"Achalgarh Fort Mount Abu"},{n:"Sunset Point",t:"5:30 PM",d:"Best Aravalli sunset view",c:"Free",k:"Sunset Point Mount Abu"}],
[{n:"Honeymoon Point",t:"9:00 AM",d:"Valley view, also Anadara Point",c:"Free",k:"Honeymoon Point Mount Abu"},{n:"Peace Park",t:"11:00 AM",d:"Brahma Kumaris garden peaceful",c:"Free",k:"Peace Park Mount Abu"},{n:"Mount Abu Bazaar",t:"5:00 PM",d:"Handicrafts & souvenirs",c:"₹500",k:"Mount Abu Bazaar"}]
];
let other=[[{n:place+" Main Spot",t:"9:00 AM",d:"Must visit highlight of "+place,c:"₹200",k:place},{n:place+" Lake / Beach",t:"12:00 PM",d:"Relax & photos, 1km away",c:"₹100",k:place+" lake"},{n:place+" View Point",t:"4:00 PM",d:"Evening sunset viewpoint",c:"Free",k:place+" viewpoint"}]];
let data=place.toLowerCase().includes("mount abu")?mount:other;
let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-weight:800;font-size:18px">📍 ${place} • ${days} Days Easy Plan</div><div style="background:#16a34a;color:#fff;padding:5px 10px;border-radius:100px;font-size:11px;font-weight:800">✓ Beautiful & Easy</div></div>`;
for(let i=0;i<days;i++){
let d=data[i%data.length];
html+=`<div class="day"><div style="font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between"><span>Day ${i+1}</span><span style="color:#16a34a">Planned</span></div><div class="row">`+d.map(s=>`<div class="sp"><div class="tm">${s.t}</div><div class="nm">📍 ${s.n}</div><div class="hi">➡️ ${s.d}</div><div style="color:#16a34a;font-weight:800;font-size:11px;margin-top:4px">${s.c}</div><div class="bt"><a class="bn" target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(s.k)}">📍 Map</a><a class="bn" target="_blank" href="https://www.google.com/maps/search/restaurants+near+${encodeURIComponent(s.k)}">🍽️ Food</a><a class="bn" target="_blank" href="https://www.google.com/maps/search/hotels+in+${encodeURIComponent(place)}">🏨 Stay</a><a class="bn" target="_blank" href="https://www.google.com/maps/search/bike+rental+${encodeURIComponent(place)}">🚲 Bike</a></div></div>`).join('')+`</div></div>`;
}
out.innerHTML=html;
out.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
