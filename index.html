<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{background:#0a0a0b;color:#fff}.nav{padding:14px 5%;display:flex;justify-content:space-between;position:sticky;top:0;background:rgba(10,10,11,.95);z-index:20}.logo{font-weight:800;font-size:20px}.logo span{color:#a5b4fc}.hero{padding:20px 5% 10px;text-align:center}.hero h1{font-size:38px;font-weight:800}.hero h1 span{color:#a5b4fc}.tabs{max-width:700px;margin:18px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.tab{padding:14px;border-radius:14px;border:2px solid #27272a;background:#18181b;color:#fff;font-weight:800;cursor:pointer}.tab.active{background:#6366f1;border-color:#6366f1}.search-wrap{max-width:1200px;margin:16px auto;background:#fff;border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;position:relative}.field label{display:block;font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1.5px solid #eef2f7;border-radius:10px;background:#f8fafc;color:#0f172a;font-weight:700;font-size:13px}.field{position:relative}.btn{grid-column:span 3;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer}.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;max-height:380px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-top:6px}.autocomplete-item{padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9}.autocomplete-item:hover{background:#eef2ff}.features{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;max-width:1300px;margin:14px auto;padding:0 4%}.fcard{border-radius:18px;overflow:hidden;height:300px;position:relative;background:#111;cursor:pointer}.fcard img{width:100%;height:100%;object-fit:cover}.fcard-info{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.92))}.fcard-info h3{font-size:13px}.fcard-info p{font-size:11px;opacity:.8;margin-top:3px}.fcard-info .plan-btn{margin-top:7px;padding:5px 10px;background:#fff;color:#0f172a;border-radius:20px;font-size:10px;font-weight:800;display:inline-block}#output{display:none;max-width:1150px;margin:20px auto;background:#f5f6f8;color:#0f172a;border-radius:24px;padding:18px}.sub-header{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px;border:1px solid #eef2f7}.sub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}.sub-card{border-radius:16px;overflow:hidden;background:#fff;border:1px solid #eef2f7;cursor:pointer}.sub-card img{width:100%;height:150px;object-fit:cover}.sub-card-body{padding:12px}.plan-form{background:#f8fafc;border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:14px;align-items:end}.plan-form label{font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase}.plan-form input,.plan-form select{padding:10px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-weight:700;width:100%}.day{background:#fff;border-radius:20px;padding:16px;margin-top:16px;border:1px solid #eef2f7}.timeline{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:8px}.step{min-width:270px;flex:1;border-radius:14px;overflow:hidden;background:#f8fafc;border:1px solid #f1f5f9;position:relative}.step img{width:100%;height:150px;object-fit:cover;display:block;background:#eee}.step-content{padding:10px}.time{position:absolute;top:8px;left:8px;background:#6366f1;color:#fff;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800}.arrow{display:flex;align-items:center;justify-content:center;min-width:24px;font-size:20px;color:#6366f1;font-weight:800}.near{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}.near a{font-size:9px;padding:6px;border-radius:6px;text-align:center;text-decoration:none;font-weight:700;background:#0f172a;color:#fff}.badge{font-size:10px;padding:4px 8px;border-radius:20px;background:#e0e7ff;color:#4338ca;font-weight:700}@media(max-width:1100px){.features{grid-template-columns:1fr 1fr 1fr}.sub-grid{grid-template-columns:1fr 1fr}.plan-form{grid-template-columns:1fr 1fr}}@media(max-width:700px){.search-wrap{grid-template-columns:1fr 1fr}.btn{grid-column:span 2}.features{grid-template-columns:1fr 1fr}.sub-grid{grid-template-columns:1fr}.plan-form{grid-template-columns:1fr}}
</style></head><body>

let liveTimeout=null;
async function showSuggestLive(val){
let box=document.getElementById('suggestBox');
if(!val||val.trim().length<1){box.style.display='none';return;}
let q=val.trim(); let qlow=q.toLowerCase();
if(q.length<3){
let local=LOCAL_PLACES.filter(p=>p.toLowerCase().startsWith(qlow)).sort((a,b)=>a.localeCompare(b)).slice(0,15);
if(local.length===0) local=LOCAL_PLACES.filter(p=>p.toLowerCase().includes(qlow)).slice(0,15);
box.innerHTML=local.map(r=>{let h=r.replace(new RegExp((${q}),'i'),'<b style="color:#6366f1">$1</b>');return <div class="autocomplete-item" onclick="selectPlace('${r.replace(/'/g,"\\'")}')"><span style="color:#0f172a;font-weight:700">${h}</span><small style="background:#eef2ff;padding:3px 8px;border-radius:10px;font-size:10px">India</small></div>;}).join('');
box.style.display='block';return;}
box.innerHTML=<div style="padding:12px;color:#64748b;font-size:12px">🔍 Searching live worldwide for "${q}"...</div>;box.style.display='block';
clearTimeout(liveTimeout);
liveTimeout=setTimeout(async()=>{
try{
let url=https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=15&lang=en;
let res=await fetch(url);let data=await res.json();
if(!data.features||data.features.length===0) throw new Error("no live");
let results=data.features.map(f=>{let p=f.properties;let name=p.name||"";let city=p.city||p.county||p.state||"";let country=p.country||"";if(!name||name.length<3)return null;let full=name+(city&&city.toLowerCase()!==name.toLowerCase()?, ${city}:"")+(country?, ${country}:"");return {full:full.trim(),name:name,country:country};}).filter(r=>r&&r.name.length>=3);
let seen=new Set();let unique=[];for(let r of results){let k=r.full.toLowerCase();if(!seen.has(k)){seen.add(k);unique.push(r);}if(unique.length>=15)break;}
if(unique.length===0) throw new Error("empty");
box.innerHTML=unique.map(r=>{let h=r.full.replace(new RegExp((${q}),'i'),'<b style="color:#6366f1">$1</b>');return <div class="autocomplete-item" onclick="selectPlace('${r.full.replace(/'/g,"\\'")}')"><span style="color:#0f172a;font-weight:700">${h}</span><small style="background:#eef2ff;padding:3px 8px;border-radius:10px;font-size:10px">${r.country||"World"}</small></div>;}).join('')+<div style="padding:8px;text-align:center;font-size:10px;color:#94a3b8">Live from OpenStreetMap • Every village worldwide</div>;
box.style.display='block';
}catch(e){
let local=LOCAL_PLACES.filter(p=>p.toLowerCase().startsWith(qlow)).slice(0,15);
if(local.length===0) local=LOCAL_PLACES.filter(p=>p.toLowerCase().includes(qlow)).slice(0,15);
box.innerHTML=local.map(r=>{let h=r.replace(new RegExp((${q}),'i'),'<b style="color:#6366f1">$1</b>');return <div class="autocomplete-item" onclick="selectPlace('${r.replace(/'/g,"\\'")}')"><span style="color:#0f172a;font-weight:700">${h}</span><small style="background:#eef2ff;padding:3px 8px;border-radius:10px;font-size:10px">India</small></div>;}).join('');
box.style.display='block';}
},400);
}
function selectPlace(name){document.getElementById('place').value=name;document.getElementById('suggestBox').style.display='none';}

function generateRealPhotoTown(place){const name=place.trim();let hash=0;for(let i=0;i<name.length;i++) hash=(hash*31+name.charCodeAt(i))%1000;return {name:name.toUpperCase(),isAuto:true,days:[[{n:${name} Main Temple / Palace,t:"9:00 AM - 1st",h:Main attraction of ${name},c:"₹50",i:getRealPhoto("temple",hash+0)},{n:${name} Local Market Bazaar,t:"11:30 AM - 2nd",h:0.5km market,c:"Free",i:getRealPhoto("market",hash+1)},{n:${name} Lake / Park,t:"4:00 PM - 3rd",h:Evening park,c:"Free",i:getRealPhoto("lake",hash+2)}],[{n:${name} Hill / Beach Viewpoint,t:"8:30 AM - 1st",h:Sunrise viewpoint,c:"Free",i:getRealPhoto("mountain",hash+3)},{n:${name} Fort / Museum Heritage,t:"11:00 AM - 2nd",h:Heritage fort museum,c:"₹100",i:getRealPhoto("fort",hash+4)},{n:${name} Famous Food Street,t:"7:00 PM - 3rd",h:Famous food street,c:"₹200",i:getRealPhoto("food",hash+5)}],[{n:${name} Waterfall / Nature Spot,t:"9:00 AM - 1st",h:Nature near ${name},c:"Free",i:getRealPhoto("waterfall",hash+6)},{n:${name} Nearby Village Tour,t:"12:00 PM - 2nd",h:Nearby village,c:"₹100",i:getRealPhoto("village",hash+7)},{n:${name} Sunset Point,t:"5:30 PM - 3rd",h:Best sunset,c:"Free",i:getRealPhoto("sunset",hash+8)}]]};}
function getData(place){let raw=place.toLowerCase().trim().replace(/\s+/g,'');let orig=place.toLowerCase().trim();if(DB[raw])return DB[raw];if(DB[orig])return DB[orig];let f=Object.keys(DB).find(k=>{let kk=k.replace(/\s+/g,'').toLowerCase();return orig.includes(k)||raw.includes(kk)||kk.includes(raw)||orig===k;});if(f)return DB[f];return generateRealPhotoTown(place);}

function planSubPlace(k,p){let days=document.getElementById('cDays')?.value||3;let trav=document.getElementById('cTrav')?.value||2;let bud=document.getElementById('cBudget')?.value||7000;let per=document.getElementById('cPersona')?.value||'friends';renderFullPlan(k,parseInt(days),trav,bud,per,p);}
function renderFullPlan(p,days,trav,budget,persona,parent){let data=getData(p);let out=document.getElementById('output');out.style.display='block';let back=parent||p.split('_')[0];out.innerHTML=<h2>✅ ${data.name} • ${days} Days • ${trav} people • ₹${budget}/person • ${persona}</h2><p style="color:#64748b;font-size:11px;margin-top:6px">${data.isAuto?Auto plan for ${data.name} — 9 DIFFERENT real photos - never laptop, never same mountain!:Real places of ${data.name} — 1st → 2nd → 3rd walkable, 100% real photos.}</p><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="showSubPlaces('${back}')" style="padding:8px 14px;border-radius:20px;border:1px solid #6366f1;background:#fff;color:#6366f1;font-weight:800;cursor:pointer">← Back to ${back.toUpperCase()} Places</button><button onclick="document.getElementById('output').style.display='none'" style="padding:8px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-weight:700;cursor:pointer">✕ Close</button></div>;
let total=Math.min(days,data.days.length);if(days>data.days.length) total=days;
for(let i=0;i<total;i++){let cl=data.days[i%data.days.length];out.innerHTML+=<div class="day"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Day ${i+1} - ${cl[0].n} Route</h3><span class="badge">Day ${i+1} • 1st → 2nd → 3rd • 9 Different Real Photos</span></div><div class="timeline">${cl.map((c,idx)=><div class="step"><span class="time">${c.t}</span><img src="${c.i}" alt="${c.n}" onerror="this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500'"><div class="step-content"><b>${idx+1}. ${c.n}</b><small style="display:block;color:#64748b">➡️ ${c.h}</small><small style="color:#16a34a;font-weight:700">${c.c}</small><div class="near"><a target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(c.n+' '+p)}">📍 Map</a><a target="_blank" href="https://www.google.com/maps/search/restaurants+near+${encodeURIComponent(c.n+' '+p)}">🍽️ Food</a><a target="_blank" href="https://www.google.com/maps/search/bike+rental+near+${encodeURIComponent(p)}">🚲 Bike</a><a target="_blank" href="https://www.google.com/maps/search/hotels+in+${encodeURIComponent(p)}">🏨 Stay</a></div></div></div>${idx<cl.length-1?'<div class="arrow">→</div>':''}).join('')}</div></div>;}out.scrollIntoView({behavior:'smooth'});}
function genAuto(){let p=document.getElementById('place').value.trim()||'munnar';let days=parseInt(document.getElementById('days').value)||3;let trav=document.getElementById('trav').value||2;let bud=parseInt(document.getElementById('budget').value)||7000;let per=document.getElementById('persona').value;renderFullPlan(p,days,trav,bud,per,'');}
function quickPlan(place){document.getElementById('place').value=place;renderFullPlan(place,3,2,7000,'friends','');}
</script></body></html>
