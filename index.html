<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WePlanYourTravel AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white}
.header{padding:20px;text-align:center;position:sticky;top:0;background:#0f172a;z-index:10}
.hero{padding:70px 20px;text-align:center;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.hero h1{font-size:42px;margin-bottom:15px}
.hero p{font-size:18px;margin-bottom:25px;opacity:.9}
.btn{padding:14px 28px;background:white;color:#6366f1;border:none;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer}
.planner{padding:50px 20px;max-width:800px;margin:0 auto}
.card{background:#1e293b;padding:28px;border-radius:15px}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:none;background:#334155;color:white;font-size:16px}
.generate{width:100%;padding:16px;background:#6366f1;color:white;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.result{margin-top:25px;background:#1e293b;padding:25px;border-radius:15px;display:none;white-space:pre-wrap;line-height:1.7}
</style>
</head>
<body>
<div class="header"><h2>✈️ WePlanYourTravel AI</h2></div>
<div class="hero">
<h1>We Plan Your Trips in 10 Sec with AI</h1>
<p>Enter destination, budget, days — Get full AI trip plan instantly</p>
<button class="btn" onclick="document.getElementById('planner').scrollIntoView({behavior:'smooth'})">Start Planning Free →</button>
</div>
<div class="planner" id="planner">
<div class="card">
<h2>🗺️ Create Your Trip</h2>
<input id="place" placeholder="Where? e.g. Goa, Manali">
<input id="days" type="number" placeholder="Days? e.g. 3">
<input id="budget" type="number" placeholder="Budget ₹ e.g. 15000">
<select id="style"><option>Chill & Relax</option><option>Adventure</option><option>Romantic</option><option>Family</option></select>
<button class="generate" onclick="generateTrip()">✨ Generate My AI Trip Plan →</button>
</div>
<div id="output" class="result"></div>
</div>
<script>
function generateTrip(){
let place=document.getElementById('place').value||'Goa';
let days=document.getElementById('days').value||'3';
let budget=document.getElementById('budget').value||'15000';
let style=document.getElementById('style').value;
let out=document.getElementById('output');
out.style.display='block';
out.innerHTML='⏳ Generating '+days+' day trip to '+place+'...';
setTimeout(()=>{
out.innerHTML=`✅ YOUR AI TRIP PLAN - ${place.toUpperCase()}

📍 Destination: ${place}
📅 Days: ${days} Days | 💰 Budget: ₹${budget} | 🎯 Style: ${style}

--- DAY 1: Arrival & Explore ---
Morning: Arrive in ${place}, Hotel check-in ₹1500/night
Afternoon: Local food + Market walk
Evening: Sunset point

--- DAY 2: Main Sightseeing ---
Morning: Top 3 attractions in ${place}
Afternoon: Adventure activity
Evening: Shopping + Cafe

--- DAY 3: Chill & Departure ---
Morning: Breakfast with view
Afternoon: Departure

💡 BUDGET:
Hotel: ₹${Math.round(budget*0.4)} | Food: ₹${Math.round(budget*0.3)} | Travel: ₹${Math.round(budget*0.2)} | Activities: ₹${Math.round(budget*0.1)}

Made by WePlanYourTravel AI ✈️`;
out.scrollIntoView({behavior:'smooth'});
},1000);
}
</script>
</body>
</html>
