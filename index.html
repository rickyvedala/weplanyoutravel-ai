<head>

<title>WePlanYourTravel AI - All States Perfect</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#0a0a0b;color:white}
.nav{padding:14px 5%;display:flex;justify-content:space-between;position:sticky;top:0;background:rgba(10,10,11,.95);backdrop-filter:blur(20px);z-index:20}
.logo{font-weight:800;font-size:20px}.logo span{color:#a5b4fc}
.hero{padding:20px 5% 10px;text-align:center}
.hero h1{font-size:38px;font-weight:800}.hero h1 span{color:#a5b4fc}
.tabs{max-width:700px;margin:18px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tab{padding:14px;border-radius:14px;border:2px solid #27272a;background:#18181b;color:white;font-weight:800;cursor:pointer}
.tab.active{background:#6366f1;border-color:#6366f1}
.search-wrap{max-width:1200px;margin:16px auto;background:white;border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field label{display:block;font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1.5px solid #eef2f7;border-radius:10px;background:#f8fafc;color:#0f172a;font-weight:700;font-size:13px}
.btn{grid-column:span 3;padding:14px;background:#6366f1;color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.features{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;max-width:1300px;margin:14px auto;padding:0 4%}
.fcard{border-radius:18px;overflow:hidden;height:300px;position:relative;background:#111;cursor:pointer}
.fcard img{width:100%;height:100%;object-fit:cover}
.fcard-info{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.fcard-info h3{font-size:13px}.fcard-info p{font-size:11px;opacity:.8;margin-top:3px}
.fcard-info .plan-btn{margin-top:7px;padding:5px 10px;background:white;color:#0f172a;border-radius:20px;font-size:10px;font-weight:800;display:inline-block}
#output{display:none;max-width:1150px;margin:20px auto;background:#f5f6f8;color:#0f172a;border-radius:24px;padding:18px}
.sub-header{background:white;border-radius:20px;padding:18px;margin-bottom:16px;border:1px solid #eef2f7}
.sub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.sub-card{border-radius:16px;overflow:hidden;background:white;border:1px solid #eef2f7;cursor:pointer;transition:.2s}
.sub-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.sub-card img{width:100%;height:150px;object-fit:cover}
.sub-card-body{padding:12px}
.sub-card-body h4{font-size:13px}.sub-card-body p{font-size:11px;color:#64748b;margin-top:4px}
.plan-form{background:#f8fafc;border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:14px;align-items:end}
.plan-form label{font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase}
.plan-form input,.plan-form select{padding:10px;border-radius:10px;border:1.5px solid #e2e8f0;background:white;font-weight:700;width:100%}
.plan-form button{padding:12px;background:#6366f1;color:white;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.day{background:white;border-radius:20px;padding:16px;margin-top:16px;border:1px solid #eef2f7}
.timeline{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:8px}
.step{min-width:270px;flex:1;border-radius:14px;overflow:hidden;background:#f8fafc;border:1px solid #f1f5f9;position:relative}
.step img{width:100%;height:150px;object-fit:cover;display:block}
.step-content{padding:10px}
.time{position:absolute;top:8px;left:8px;background:#6366f1;color:white;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800}
.arrow{display:flex;align-items:center;justify-content:center;min-width:24px;font-size:20px;color:#6366f1;font-weight:800}
.near{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.near a{font-size:9px;padding:6px;border-radius:6px;text-align:center;text-decoration:none;font-weight:700;background:#0f172a;color:white}
.badge{font-size:10px;padding:4px 8px;border-radius:20px;background:#e0e7ff;color:#4338ca;font-weight:700}
@media(max-width:1100px){.features{grid-template-columns:1fr 1fr 1fr}.sub-grid{grid-template-columns:1fr 1fr}.plan-form{grid-template-columns:1fr 1fr}}@media(max-width:700px){.search-wrap{grid-template-columns:1fr 1fr}.btn{grid-column:span 2}.features{grid-template-columns:1fr 1fr}.sub-grid{grid-template-columns:1fr}.plan-form{grid-template-columns:1fr}}
</style>
</head>

<div class="field"><label>❤️ Interest</label><select id="interest"><option value="all">All</option><option value="beach">Beach 🏖️</option><option value="mountains">Mountains ❄️</option><option value="heritage">Heritage 🏰</option><option value="nature">Nature 🌿</option></select></div>
<div class="field"><label>📍 Where? Any Town/Village</label><input id="place" placeholder="Munnar, Narasapur, Paris, Any town..."></div>
<div class="field"><label>📅 Days</label><input id="days" type="number" value="3"></div>
<div class="field"><label>👥 Travellers</label><input id="trav" type="number" value="2"></div>
<div class="field"><label>💰 Budget/Person</label><input id="budget" type="number" value="7000"></div>
<button class="btn" onclick="genAuto()">✨ AutoPlan ANY Town →</button>
</div>
</div>

<div id="exploreBox" style="display:none">
<h2 style="text-align:center;margin:20px">🌍 Explore Places — Click Any State/Country to See Beautiful Places Inside</h2>
<div class="features" id="exploreGrid"></div>
</div>

<div id="output"></div>

function switchTab(t){
document.getElementById('tabAuto').classList.toggle('active',t==='auto');
document.getElementById('tabExplore').classList.toggle('active',t==='explore');
document.getElementById('autoBox').style.display=t==='auto'?'grid':'none';
document.getElementById('exploreBox').style.display=t==='explore'?'block':'none';
}

let grid=document.getElementById('exploreGrid');

}
renderExplore();

function generateAnyTown(place){
  const name=place.trim();
  const enc=encodeURIComponent(name);
  return {
    name: name.toUpperCase(),
    isAuto:true,
    days:[
      [{n:`${name} Main Temple / Attraction`,t:"9:00 AM - 1st",h:`Main attraction of ${name}`,c:"₹20",i:`https://picsum.photos/seed/${enc}1/500/300`},{n:`${name} Market`,t:"11:30 AM - 2nd",h:`0.5km market`,c:"Free",i:`https://picsum.photos/seed/${enc}2/500/300`},{n:`${name} Lake / Park`,t:"4:00 PM - 3rd",h:`Evening park`,c:"Free",i:`https://picsum.photos/seed/${enc}3/500/300`}],
      [{n:`${name} Hill / Beach View`,t:"8:30 AM - 1st",h:`Sunrise view`,c:"Free",i:`https://picsum.photos/seed/${enc}4/500/300`},{n:`${name} Fort / Museum`,t:"11:00 AM - 2nd",h:`Heritage`,c:"₹50",i:`https://picsum.photos/seed/${enc}5/500/300`},{n:`${name} Food Street`,t:"7:00 PM - 3rd",h:`Street food`,c:"₹150",i:`https://picsum.photos/seed/${enc}6/500/300`}],
      [{n:`${name} Nature Spot`,t:"9:00 AM - 1st",h:`Nature near ${name}`,c:"Free",i:`https://picsum.photos/seed/${enc}7/500/300`},{n:`${name} Village Tour`,t:"12:00 PM - 2nd",h:`Nearby village`,c:"₹100",i:`https://picsum.photos/seed/${enc}8/500/300`},{n:`${name} Sunset Point`,t:"5:30 PM - 3rd",h:`Sunset`,c:"Free",i:`https://picsum.photos/seed/${enc}9/500/300`}]
    ]
  };
}

function getData(place){
  let raw=place.toLowerCase().trim().replace(/\s+/g,'');
  let orig=place.toLowerCase().trim();
  if(DB[raw]) return DB[raw];
  if(DB[orig]) return DB[orig];
  let found=Object.keys(DB).find(k=>orig.includes(k) || k.includes(orig) || raw.includes(k));
  if(found) return DB[found];
  return generateAnyTown(place);
}

function showSubPlaces(parent){
  let list=SUB_PLACES[parent];
  if(!list){ quickPlan(parent); return; }
  let out=document.getElementById('output'); out.style.display='block';
  let parentName=parent.toUpperCase();
  out.innerHTML=`
  <div class="sub-header">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <h2>✨ Beautiful Places in ${parentName} — ${list.length} Places Inside</h2>
      <button onclick="document.getElementById('output').style.display='none'" style="padding:6px 12px;border-radius:20px;border:1px solid #e2e8f0;background:white;font-weight:700;cursor:pointer">✕ Close</button>
    </div>
    <p style="color:#64748b;font-size:12px;margin-top:6px">Click any beautiful place in ${parentName} — then set Days, Budget, Travellers and make a perfect plan for that specific place! Works for all states & countries!</p>
    <div class="plan-form">
      <div><label>📅 Days</label><input id="cDays" type="number" value="3"></div>
      <div><label>👥 Travellers</label><input id="cTrav" type="number" value="2"></div>
      <div><label>💰 Budget/Person</label><input id="cBudget" type="number" value="7000"></div>
      <div><label>👤 Who?</label><select id="cPersona"><option value="friends">Friends</option><option value="couple">Couple</option><option value="family">Family</option><option value="students">Students</option><option value="solo">Solo</option></select></div>
    </div>
    <div class="sub-grid">
      ${list.map(p=>`
        <div class="sub-card" onclick="planSubPlace('${p.k}', '${parent}')">
          <img src="${p.i}" alt="${p.n}">
          <div class="sub-card-body">
            <h4>${p.n}</h4>
            <p>${p.d}</p>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
              <span style="font-size:9px;padding:4px 8px;background:#e0e7ff;color:#4338ca;border-radius:12px;font-weight:700">📍 Map</span>
              <span style="font-size:9px;padding:4px 8px;background:#dcfce7;color:#166534;border-radius:12px;font-weight:700">🍽️ Food</span>
              <span style="font-size:9px;padding:4px 8px;background:#fef3c7;color:#92400e;border-radius:12px;font-weight:700">🚲 Bike Rental</span>
            </div>
            <button style="margin-top:10px;width:100%;padding:8px;background:#0f172a;color:white;border:none;border-radius:10px;font-weight:800;font-size:12px">✨ Make Plan for ${p.n} →</button>
          </div>
        </div>
      `).join('')}
    </div>
  </div>
  `;
  out.scrollIntoView({behavior:'smooth'});
}

function planSubPlace(key, parent){
  let days=document.getElementById('cDays')?.value||3;
  let trav=document.getElementById('cTrav')?.value||2;
  let budget=document.getElementById('cBudget')?.value||7000;
  let persona=document.getElementById('cPersona')?.value||'friends';
  renderFullPlan(key, parseInt(days), trav, budget, persona, parent);
}

function renderFullPlan(p, days, trav, budget, persona, parent){
  let data=getData(p);
  let out=document.getElementById('output'); out.style.display='block';
  let backKey=parent||p.split('_')[0];
  out.innerHTML=`<h2>✅ ${data.name} • ${days} Days • ${trav} people • ₹${budget}/person • ${persona}</h2>
  <p style="color:#64748b;font-size:11px;margin-top:6px">${data.isAuto ? `Auto plan for ${data.name} — small town/village supported! 9 different photos, live maps for ${data.name}` : `Real places of ${data.name} — 1st → 2nd → 3rd walkable, different photos, no repeat.`}</p>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="showSubPlaces('${backKey}')" style="padding:8px 14px;border-radius:20px;border:1px solid #6366f1;background:white;color:#6366f1;font-weight:800;cursor:pointer">← Back to ${backKey.toUpperCase()} Beautiful Places</button>
    <button onclick="document.getElementById('output').style.display='none'" style="padding:8px 14px;border-radius:20px;border:1px solid #e2e8f0;background:white;font-weight:700;cursor:pointer">✕ Close Plan</button>
  </div>
  `;
  let total=Math.min(days, data.days.length); if(days>data.days.length) total=days;
  for(let i=0;i<total;i++){
    let cl=data.days[i % data.days.length];
    out.innerHTML+=`<div class="day"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Day ${i+1} - ${cl[0].n} Route</h3><span class="badge">Day ${i+1} • 1st → 2nd → 3rd • No Same Photo</span></div><div class="timeline">${cl.map((c,idx)=>`<div class="step"><span class="time">${c.t}</span><img src="${c.i}" alt="${c.n}"><div class="step-content"><b>${idx+1}. ${c.n}</b><small style="display:block;color:#64748b">➡️ ${c.h}</small><small style="color:#16a34a;font-weight:700">${c.c}</small><div class="near"><a target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(c.n+' '+p)}">📍 Map ${p}</a><a target="_blank" href="https://www.google.com/maps/search/restaurants+near+${encodeURIComponent(c.n+' '+p)}">🍽️ Food Near</a><a target="_blank" href="https://www.google.com/maps/search/bike+rental+near+${encodeURIComponent(p)}">🚲 Bike in ${p}</a><a target="_blank" href="https://www.google.com/maps/search/hotels+in+${encodeURIComponent(p)}">🏨 Hotels in ${p}</a></div></div></div>${idx<cl.length-1?'<div class="arrow">→</div>':''}`).join('')}</div></div>`;
  }
  out.scrollIntoView({behavior:'smooth'});
}

function genAuto(){
let p=document.getElementById('place').value.trim()||'munnar';
let days=parseInt(document.getElementById('days').value)||3;
let trav=document.getElementById('trav').value||2;
let budget=parseInt(document.getElementById('budget').value)||7000;
let persona=document.getElementById('persona').value;
renderFullPlan(p,days,trav,budget,persona,'');
}
function quickPlan(place){
document.getElementById('place').value=place;
renderFullPlan(place,3,2,7000,'friends','');
}
</script>
