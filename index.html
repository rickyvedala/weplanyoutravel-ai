*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#0a0a0b;color:white}
.nav{padding:14px 5%;display:flex;justify-content:space-between;position:sticky;top:0;background:rgba(10,10,11,.95);backdrop-filter:blur(20px);z-index:20}
.logo{font-weight:800;font-size:20px}.logo span{color:#a5b4fc}
.hero{padding:20px 5% 10px;text-align:center}
.hero h1{font-size:38px;font-weight:800}.hero h1 span{color:#a5b4fc}
.tabs{max-width:700px;margin:18px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tab{padding:14px;border-radius:14px;border:2px solid #27272a;background:#18181b;color:white;font-weight:800;cursor:pointer}
.tab.active{background:#6366f1;border-color:#6366f1}
.search-wrap{max-width:1200px;margin:16px auto;background:white;border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;position:relative}
.field label{display:block;font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1.5px solid #eef2f7;border-radius:10px;background:#f8fafc;color:#0f172a;font-weight:700;font-size:13px}
.field{position:relative}
.btn{grid-column:span 3;padding:14px;background:#6366f1;color:white;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:white;border:1px solid #e2e8f0;border-radius:12px;max-height:380px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 30px rgba(0,0,0,.15);margin-top:6px}
.autocomplete-item{padding:11px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9}
.autocomplete-item:hover{background:#eef2ff}
.features{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;max-width:1300px;margin:14px auto;padding:0 4%}
.fcard{border-radius:18px;overflow:hidden;height:300px;position:relative;background:#111;cursor:pointer}
.fcard img{width:100%;height:100%;object-fit:cover}
.fcard-info{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.92))}

#output{display:none;max-width:1150px;margin:20px auto;background:#f5f6f8;color:#0f172a;border-radius:24px;padding:18px}
.sub-header{background:white;border-radius:20px;padding:18px;margin-bottom:16px;border:1px solid #eef2f7}
.sub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.sub-card{border-radius:16px;overflow:hidden;background:white;border:1px solid #eef2f7;cursor:pointer}
.sub-card img{width:100%;height:150px;object-fit:cover}
.sub-card-body{padding:12px}
.plan-form{background:#f8fafc;border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:14px;align-items:end}
.plan-form label{font-size:10px;font-weight:800;color:#6366f1;text-transform:uppercase}
.plan-form input,.plan-form select{padding:10px;border-radius:10px;border:1.5px solid #e2e8f0;background:white;font-weight:700;width:100%}
.day{background:white;border-radius:20px;padding:16px;margin-top:16px;border:1px solid #eef2f7}
.timeline{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:8px}
.step{min-width:270px;flex:1;border-radius:14px;overflow:hidden;background:#f8fafc;border:1px solid #f1f5f9;position:relative}
.step img{width:100%;height:150px;object-fit:cover;display:block;background:#eee}
.step-content{padding:10px}
.time{position:absolute;top:8px;left:8px;background:#6366f1;color:white;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800}
.arrow{display:flex;align-items:center;justify-content:center;min-width:24px;font-size:20px;color:#6366f1;font-weight:800}
.near{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.near a{font-size:9px;padding:6px;border-radius:6px;text-align:center;text-decoration:none;font-weight:700;background:#0f172a;color:white}

let liveTimeout=null;
// LIVE WORLD SEARCH USING OPENSTREETMAP (Every tourist spot on Earth!)
async function showSuggestLive(val){
  let box=document.getElementById('suggestBox');
  if(!val || val.trim().length<2){ box.style.display='none'; return; }
  let q=val.trim();
  box.innerHTML=`<div style="padding:12px;color:#64748b;font-size:12px">🔍 Searching live worldwide for "${q}"...</div>`;
  box.style.display='block';
  
  clearTimeout(liveTimeout);
  liveTimeout=setTimeout(async()=>{
    try{
      // Photon API - OpenStreetMap worldwide, no key needed, gives villages, beaches, temples, everything!
      let url=`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=15&lang=en`;
      let res=await fetch(url);
      let data=await res.json();
      if(!data.features || data.features.length===0) throw new Error("no live");
      
      let results=data.features.map(f=>{
        let p=f.properties;
        let name=p.name||p.street||"";
        let city=p.city||p.county||"";
        let state=p.state||"";
        let country=p.country||"";
        let full=name + (city && city!==name ? `, ${city}` : "") + (country ? `, ${country}` : "");
        let type=p.osm_type||"";
        return {full: full.trim(), name: name, country: country, state: state, city: city};
      }).filter(r=>r.name && r.name.length>=2);
      
      // Deduplicate
      let seen=new Set();
      let unique=[];
      for(let r of results){
        let key=r.full.toLowerCase();
        if(!seen.has(key) && r.full.length>2){ seen.add(key); unique.push(r); }
        if(unique.length>=15) break;
      }
      
      if(unique.length===0) throw new Error("empty");
      
      box.innerHTML=unique.map(r=>{
        let highlighted=r.full.replace(new RegExp(`(${q})`,'i'), '<b style="color:#6366f1">$1</b>');
        return `<div class="autocomplete-item" onclick="selectPlace('${r.full.replace(/'/g,"\\'")}')"><span><b>${highlighted}</b></span><small>${r.country||r.state||"World"}</small></div>`;
      }).join('') + `<div style="padding:8px;text-align:center;font-size:10px;color:#94a3b8">Live from OpenStreetMap • Every village, beach, temple worldwide</div>`;
      box.style.display='block';
    }catch(e){
      // Fallback to local if API fails
      let qlow=q.toLowerCase();
      let local=LOCAL_PLACES.filter(p=>p.toLowerCase().startsWith(qlow)).slice(0,12);
      if(local.length===0) local=LOCAL_PLACES.filter(p=>p.toLowerCase().includes(qlow)).slice(0,12);
      box.innerHTML=local.map(r=>{
        let highlighted=r.replace(new RegExp(`(${q})`,'i'), '<b style="color:#6366f1">$1</b>');
        return `<div class="autocomplete-item" onclick="selectPlace('${r.replace(/'/g,"\\'")}')"><span><b>${highlighted}</b></span><small>Local</small></div>`;
      }).join('') + `<div style="padding:8px;text-align:center;font-size:10px;color:#94a3b8">Offline mode • Type any place, it will still create plan!</div>`;
      box.style.display='block';
    }
  }, 300);
}

function selectPlace(name){
  document.getElementById('place').value=name;
  document.getElementById('suggestBox').style.display='none';
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.field')){ 
    let box=document.getElementById('suggestBox');
    if(box) box.style.display='none'; 
  }
});

function generateRealPhotoTown(place){
  const name=place.trim();
  const enc=encodeURIComponent(name);
  return {
    name: name.toUpperCase(),
    isAuto:true,
    days:[
      [{n:`${name} Main Temple / Palace`,t:"9:00 AM - 1st",h:`Main attraction of ${name}`,c:"₹50",i:`https://source.unsplash.com/500x300/?${enc},travel,temple&sig=1`},{n:`${name} Local Market Bazaar`,t:"11:30 AM - 2nd",h:`0.5km market`,c:"Free",i:`https://source.unsplash.com/500x300/?${enc},market&sig=2`},{n:`${name} Lake / Park`,t:"4:00 PM - 3rd",h:`Evening park`,c:"Free",i:`https://source.unsplash.com/500x300/?${enc},lake&sig=3`}],
      [{n:`${name} Hill / Beach Viewpoint`,t:"8:30 AM - 1st",h:`Sunrise viewpoint`,c:"Free",i:`https://source.unsplash.com/500x300/?${enc},mountain,beach&sig=4`},{n:`${name} Fort / Museum Heritage`,t:"11:00 AM - 2nd",h:`Heritage fort museum`,c:"₹100",i:`https://source.unsplash.com/500x300/?${enc},fort,heritage&sig=5`},{n:`${name} Famous Food Street`,t:"7:00 PM - 3rd",h:`Famous food street`,c:"₹200",i:`https://source.unsplash.com/500x300/?${enc},food&sig=6`}],
      [{n:`${name} Waterfall / Nature Spot`,t:"9:00 AM - 1st",h:`Nature near ${name}`,c:"Free",i:`https://source.unsplash.com/500x300/?${enc},waterfall,nature&sig=7`},{n:`${name} Nearby Village Tour`,t:"12:00 PM - 2nd",h:`Nearby village`,c:"₹100",i:`https://source.unsplash.com/500x300/?${enc},village&sig=8`},{n:`${name} Sunset Point`,t:"5:30 PM - 3rd",h:`Best sunset`,c:"Free",i:`https://source.unsplash.com/500x300/?${enc},sunset&sig=9`}]
    ]
  };
}

function getData(place){
  let raw=place.toLowerCase().trim().replace(/\s+/g,'');
  let orig=place.toLowerCase().trim();
  if(DB[raw]) return DB[raw];
  if(DB[orig]) return DB[orig];
  let found=Object.keys(DB).find(k=>{
    let kk=k.replace(/\s+/g,'').toLowerCase();
    return orig.includes(k) || raw.includes(kk) || kk.includes(raw) || orig===k;
  });
  if(found) return DB[found];
  return generateRealPhotoTown(place);
}

function showSubPlaces(parent){
  let list=SUB_PLACES[parent];
  if(!list){ quickPlan(parent); return; }
  let out=document.getElementById('output'); out.style.display='block';
  let parentName=parent.toUpperCase();
  out.innerHTML=`
  <div class="sub-header">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <h2>✨ Beautiful Places in ${parentName} — ${list.length} Places Inside</h2>
      <button onclick="document.getElementById('output').style.display='none'" style="padding:6px 12px;border-radius:20px;border:1px solid #e2e8f0;background:white;font-weight:700;cursor:pointer">✕ Close</button>
    </div>
    <p style="color:#64748b;font-size:12px;margin-top:6px">Click any beautiful place in ${parentName} — then set Days, Budget and make perfect plan!</p>
    <div class="plan-form">
      <div><label>📅 Days</label><input id="cDays" type="number" value="3"></div>
      <div><label>👥 Travellers</label><input id="cTrav" type="number" value="2"></div>
      <div><label>💰 Budget/Person</label><input id="cBudget" type="number" value="7000"></div>
      <div><label>👤 Who?</label><select id="cPersona"><option value="friends">Friends</option><option value="couple">Couple</option><option value="family">Family</option><option value="students">Students</option><option value="solo">Solo</option></select></div>
    </div>
    <div class="sub-grid">
      ${list.map(p=>`
        <div class="sub-card" onclick="planSubPlace('${p.k}', '${parent}')">
          <img src="${p.i}" alt="${p.n}">
          <div class="sub-card-body">
            <h4>${p.n}</h4>
            <p>${p.d}</p>
            <button style="margin-top:10px;width:100%;padding:8px;background:#0f172a;color:white;border:none;border-radius:10px;font-weight:800;font-size:12px">✨ Make Plan for ${p.n} →</button>
          </div>
        </div>
      `).join('')}
    </div>
  </div>
  `;
  out.scrollIntoView({behavior:'smooth'});
}

function planSubPlace(key, parent){
  let days=document.getElementById('cDays')?.value||3;
  let trav=document.getElementById('cTrav')?.value||2;
  let budget=document.getElementById('cBudget')?.value||7000;
  let persona=document.getElementById('cPersona')?.value||'friends';
  renderFullPlan(key, parseInt(days), trav, budget, persona, parent);
}

function renderFullPlan(p, days, trav, budget, persona, parent){
  let data=getData(p);
  let out=document.getElementById('output'); out.style.display='block';
  let backKey=parent||p.split('_')[0];
  out.innerHTML=`<h2>✅ ${data.name} • ${days} Days • ${trav} people • ₹${budget}/person • ${persona}</h2>
  <p style="color:#64748b;font-size:11px;margin-top:6px">${data.isAuto ? `Auto plan for ${data.name} — Live photos from Unsplash for ${data.name}, works for EVERY tourist spot on Earth` : `Real places of ${data.name} — 1st → 2nd → 3rd walkable, 100% real photos.`}</p>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
    <button onclick="showSubPlaces('${backKey}')" style="padding:8px 14px;border-radius:20px;border:1px solid #6366f1;background:white;color:#6366f1;font-weight:800;cursor:pointer">← Back to ${backKey.toUpperCase()} Places</button>
    <button onclick="document.getElementById('output').style.display='none'" style="padding:8px 14px;border-radius:20px;border:1px solid #e2e8f0;background:white;font-weight:700;cursor:pointer">✕ Close</button>
  </div>
  `;
  let total=Math.min(days, data.days.length); if(days>data.days.length) total=days;
  for(let i=0;i<total;i++){
    let cl=data.days[i % data.days.length];
    out.innerHTML+=`<div class="day"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Day ${i+1} - ${cl[0].n} Route</h3><span class="badge">Day ${i+1} • 1st → 2nd → 3rd • Real Photos</span></div><div class="timeline">${cl.map((c,idx)=>`<div class="step"><span class="time">${c.t}</span><img src="${c.i}" alt="${c.n}" onerror="this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500'"><div class="step-content"><b>${idx+1}. ${c.n}</b><small style="display:block;color:#64748b">➡️ ${c.h}</small><small style="color:#16a34a;font-weight:700">${c.c}</small><div class="near"><a target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(c.n+' '+p)}">📍 Map</a><a target="_blank" href="https://www.google.com/maps/search/restaurants+near+${encodeURIComponent(c.n+' '+p)}">🍽️ Food</a><a target="_blank" href="https://www.google.com/maps/search/bike+rental+near+${encodeURIComponent(p)}">🚲 Bike</a><a target="_blank" href="https://www.google.com/maps/search/hotels+in+${encodeURIComponent(p)}">🏨 Stay</a></div></div></div>${idx<cl.length-1?'<div class="arrow">→</div>':''}`).join('')}</div></div>`;
  }
  out.scrollIntoView({behavior:'smooth'});
}

function genAuto(){
let p=document.getElementById('place').value.trim()||'munnar';
let days=parseInt(document.getElementById('days').value)||3;
let trav=document.getElementById('trav').value||2;
let budget=parseInt(document.getElementById('budget').value)||7000;
let persona=document.getElementById('persona').value;
renderFullPlan(p,days,trav,budget,persona,'');
}
function quickPlan(place){
document.getElementById('place').value=place;
renderFullPlan(place,3,2,7000,'friends','');
}
