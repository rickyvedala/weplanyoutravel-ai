<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WePlanYourTravel AI - Worldwide with Live Locations</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#fcfcfd;color:#0f172a}
.nav{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);z-index:30;border-bottom:1px solid #f1f5f9}
.logo{font-weight:800;font-size:22px}.logo span{color:#6366f1}
.hero{padding:60px 5% 130px;text-align:center;background:radial-gradient(1000px 500px at 50% -10%,#e0e7ff 0%,#f8fafc 60%)}
.hero h1{font-size:56px;font-weight:800;line-height:.95;letter-spacing:-2px;max-width:900px;margin:0 auto 16px}.hero h1 em{font-style:normal;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#64748b;font-size:18px;max-width:650px;margin:0 auto}
.search{max-width:1150px;margin:-85px auto 0;background:white;border-radius:28px;padding:20px;box-shadow:0 30px 80px rgba(15,23,42,.12);display:grid;grid-template-columns:1.5fr .5fr .7fr .7fr .8fr;gap:10px;position:relative;z-index:10}
.search label{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;display:block;margin-bottom:5px}
.search input,.search select{width:100%;padding:15px;border:1px solid #eef2f7;border-radius:14px;background:#f8fafc;font-size:14px;font-weight:600}
.btn{padding:15px;background:#0f172a;color:white;border:none;border-radius:14px;font-weight:700;cursor:pointer}.btn:hover{background:#6366f1}
#output{display:none;max-width:1150px;margin:40px auto;padding:0 5% 100px}
.day{background:white;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #f1f5f9;margin-top:26px;overflow:hidden}
.day-top{padding:20px 24px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9}
.day-body{padding:20px 24px;display:grid;grid-template-columns:1.2fr .8fr;gap:20px}
.place{padding:16px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:16px;margin-bottom:10px}
.near-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.near-btn{display:block;padding:10px 12px;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;text-align:center;border:1px solid #e2e8f0}
.nb{background:#f1f5f9;color:#0f172a}.nb:hover{background:#0f172a;color:white}
.nc{background:#fef3c7;color:#92400e;border-color:#fde68a}.nc:hover{background:#f59e0b;color:white}
.nr{background:#fee2e2;color:#991b1b;border-color:#fecaca}.nr:hover{background:#ef4444;color:white}
.stay{display:flex;justify-content:space-between;padding:11px 13px;border:1px solid #f1f5f9;border-radius:14px;background:white;margin-bottom:8px}
.tag{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700}
@media(max-width:900px){.search{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}.day-body{grid-template-columns:1fr}.near-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="nav"><div class="logo">✈️ WePlan<span>YourTravel</span> AI</div><div style="font-size:11px;padding:7px 12px;background:#f1f5f9;border-radius:20px">🌍 Worldwide • 📍 Live Maps • 🚲 Bike & Car Rentals</div></div>
<div class="hero"><h1>Every place has <em>everything nearby</em></h1><p>Hotels, hostels, homestays, dorms, cafes, restaurants, bike rentals, car rentals — all with live location near your search.</p></div>
<div class="search">
<div><label>Where to?</label><input id="place" placeholder="Goa, Paris, Bali, Dubai, Manali..."></div>
<div><label>Days</label><input id="days" type="number" value="3"></div>
<div><label>Budget</label><input id="budget" type="number" value="15000"></div>
<div><label>Currency</label><select id="curr"><option value="INR">INR ₹</option><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option><option value="AED">AED</option><option value="THB">THB ฿</option><option value="SGD">SGD $</option></select></div>
<div><button class="btn" onclick="gen()">✨ Generate →</button></div>
</div>
<div id="output"></div>
<script>
const R={INR:1,USD:0.012,EUR:0.011,GBP:0.0095,AED:0.044,THB:0.42,SGD:0.016}; const S={INR:'₹',USD:'$',EUR:'€',GBP:'£',AED:'AED ',THB:'฿',SGD:'S$'};
const DB={
"goa":{city:"Goa",places:[["Baga Beach","Beach party"],["Fort Aguada","Fort view"],["Anjuna Market","Shopping"]],stays:[["Taj Village Hotel","Hotel","6500","4.8"],["Zostel Hostel","Hostel","1200","4.7"],["Beach Dorm","Dorm","600","4.5"],["Local Homestay","Homestay","2500","4.9"]],bikes:[["Goa Activa Rental","Scooty ₹400/day"],["Royal Enfield Rental","Bike ₹900/day"]],cars:[["Goa Car Rental Self Drive","Swift ₹1500/day"],["Innova Rental","₹3000/day"]],food:[["Vinayak Restaurant","Fish Thali"],["Baba Au Rhum Cafe","Pizza & Coffee"]]},
"paris":{city:"Paris",places:[["Eiffel Tower","Iconic"],["Louvre Museum","Art"],["Montmartre","Cafes"]],stays:[["Le Meurice Hotel","Hotel","38000","4.9"],["St Christopher Hostel","Hostel","3200","4.5"],["Paris Dorm","Dorm","2200","4.4"],["Le Marais Homestay","Homestay","8500","4.8"]],bikes:[["Velib Bike Share","€2/hr"],["Lime E-Scooter","€0.25/min"]],cars:[["Sixt Car Rental Paris","Car €45/day"],["Europcar","€50/day"]],food:[["Breizh Cafe","Crepes"],["Cafe de Flore","Coffee"]]},
"default":{city:"Your Destination",places:[["City Center","Market"],["Sunset Point","View"],["Local Street","Food & culture"]],stays:[["City Hotel","Hotel","3500","4.5"],["Backpackers Hostel","Hostel","1000","4.6"],["Dorm Stay","Dorm","600","4.4"],["Family Homestay","Homestay","1800","4.8"]],bikes:[["Local Bike Rental","Bike ₹400/day"],["Scooty Rental","Scooty ₹350/day"]],cars:[["Local Car Rental","Swift ₹1500/day"],["Sedan Rental","₹2200/day"]],food:[["Local Famous Restaurant","Local Food"],["Best Cafe","Coffee"]]}
};
function getDB(p){p=p.toLowerCase();let k=Object.keys(DB).find(x=>p.includes(x));return k?DB[k]:DB["default"];}
function fmt(b,c){return S[c]+Math.round(b*R[c]).toLocaleString();}
function gen(){
let p=document.getElementById('place').value||'Goa'; let days=parseInt(document.getElementById('days').value)||3; let budget=parseInt(document.getElementById('budget').value)||15000; let cur=document.getElementById('curr').value; let d=getDB(p);
let out=document.getElementById('output'); out.style.display='block';
out.innerHTML=`<div style="background:#0f172a;color:white;border-radius:24px;padding:28px"><h2>✅ ${p.toUpperCase()} • ${days} Days • Budget ${fmt(budget,cur)}</h2><p style="opacity:.7;margin-top:6px">📍 ${d.city} • Showing nearest stays, food, bike & car rentals with live location</p></div>`;
for(let i=1;i<=days;i++){
let pl=d.places[(i-1)%d.places.length]; let placeQuery=encodeURIComponent(pl[0]+' '+p);
out.innerHTML+=`
<div class="day">
<div class="day-top"><h3>Day ${i} — ${pl[0]}</h3><span style="font-size:11px;background:#0f172a;color:white;padding:6px 10px;border-radius:20px">${pl[1]}</span></div>
<div class="day-body">
<div>
<div class="place"><b>${pl[0]}</b><div style="font-size:13px;color:#64748b;margin-top:4px">${pl[1]} - Best time to visit</div>
<div class="near-grid">
<a class="near-btn nb" target="_blank" href="https://www.google.com/maps/search/bike+rental+near+${placeQuery}">🚲 Bike Rentals Near</a>
<a class="near-btn nb" target="_blank" href="https://www.google.com/maps/search/car+rental+near+${placeQuery}">🚗 Car Rentals Near</a>
<a class="near-btn nr" target="_blank" href="https://www.google.com/maps/search/restaurants+near+${placeQuery}">🍽️ Restaurants Near</a>
<a class="near-btn nc" target="_blank" href="https://www.google.com/maps/search/cafes+near+${placeQuery}">☕ Cafes Near</a>
<a class="near-btn nb" target="_blank" href="https://www.google.com/maps/search/hotels+near+${placeQuery}">🏨 Hotels Near</a>
<a class="near-btn nb" target="_blank" href="https://www.google.com/maps/search/hostels+near+${placeQuery}">🎒 Hostels Near</a>
<a class="near-btn nb" target="_blank" href="https://www.google.com/maps/search/${placeQuery}">📍 Open ${pl[0]} Location</a>
<a class="near-btn nb" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${placeQuery}">🧭 Directions</a>
</div>
</div>
<div style="margin-top:14px"><b style="font-size:13px">🚲 Bike & 🚗 Car Rentals - ${pl[0]}</b>
<div style="margin-top:8px">
${d.bikes.map(b=>`<div class="stay"><div><b style="font-size:13px">${b[0]}</b><br><small style="color:#64748b">${b[1]}</small></div><a target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(b[0]+' near '+p)}" style="font-size:11px;color:#6366f1;font-weight:700">📍 Location →</a></div>`).join('')}
${d.cars.map(b=>`<div class="stay"><div><b style="font-size:13px">🚗 ${b[0]}</b><br><small style="color:#64748b">${b[1]}</small></div><a target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(b[0]+' near '+p)}" style="font-size:11px;color:#6366f1;font-weight:700">📍 Location →</a></div>`).join('')}
</div></div>
</div>
<div>
<b style="font-size:13px">🏨 Stays Near ${pl[0]}</b>
<div style="margin-top:8px">
${d.stays.map(s=>`<div class="stay"><div><b style="font-size:13px">${s[0]}</b><br><small style="color:#64748b">${fmt(parseInt(s[2]),cur)} • ${s[3]}★</small></div><span class="tag" style="background:${s[1]=='Hotel'?'#e0e7ff':s[1]=='Hostel'?'#fef3c7':s[1]=='Dorm'?'#fce7f3':'#dcfce7'}">${s[1]}</span></div>`).join('')}
<a target="_blank" href="https://www.google.com/maps/search/hotels+near+${placeQuery}" style="display:block;margin-top:8px;padding:10px;background:#f1f5f9;border-radius:12px;text-align:center;font-size:12px;font-weight:700;text-decoration:none;color:#0f172a">🔍 See ALL stays near ${pl[0]} on Maps →</a>
</div>
<div style="margin-top:16px"><b style="font-size:13px">🍽️ Food Near ${pl[0]}</b>
<div style="margin-top:8px">
${d.food.map(f=>`<div class="stay"><div><b style="font-size:13px">${f[0]}</b><br><small style="color:#64748b">${f[1]}</small></div><a target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(f[0]+' near '+pl[0]+' '+p)}" style="font-size:11px;color:#ef4444;font-weight:700">📍 Near →</a></div>`).join('')}
</div>
</div>
</div>
</div>
</div>`;
}
out.innerHTML+=`<div style="margin-top:20px;background:white;border-radius:20px;padding:20px;border:1px solid #f1f5f9"><h3>💰 Budget ${fmt(budget,cur)} — All rentals included</h3><p style="color:#64748b;margin-top:8px;font-size:14px">Tip: Every button opens live Google Maps near that exact place. Bike/Car rentals, restaurants, hotels — all location-based. No fake data.</p></div>`;
out.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
